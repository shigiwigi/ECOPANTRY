# Render Blueprint for the EcoPantry API (FastAPI), free plan.
# The database is Neon PostgreSQL, not Render. The website is on Firebase
# Hosting and calls this API cross-origin, so CORS_ORIGINS lists its exact
# origins and the session cookie is SameSite=None. Setup steps: docs/DEPLOYMENT.md.
#
# No secrets in this file. DATABASE_URL is marked `sync: false`, so Render asks
# for it in the dashboard when the Blueprint is created and never reads it from Git.
services:
  - type: web
    name: ecopantry-api
    runtime: python
    plan: free
    # Neon project must be in the same place: AWS Asia Pacific (Singapore).
    region: singapore
    branch: main
    rootDir: website/backend
    buildCommand: pip install .
    # The free plan has no pre-deploy step or shell, so migrations run here.
    # `alembic upgrade head` does nothing when the database is already current.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: LOG_LEVEL
        value: INFO
      # Neon suspends its compute when idle; give the first connection time to wake it.
      # Shared secret for the ESP32-CAM; set it in the Render dashboard, never here.
      - key: CAMERA_DEVICE_SECRET
        sync: false
      - key: DATABASE_CONNECT_TIMEOUT
        value: "15"
      # Not secrets. The only browser origins allowed to call the API with the session cookie.
      - key: CORS_ORIGINS
        value: https://ecopantry-a7342.web.app,https://ecopantry-a7342.firebaseapp.com
      # Google sign-in accepts ID tokens for this Firebase project only.
      - key: FIREBASE_PROJECT_ID
        value: ecopantry-a7342
      - key: DATABASE_URL
        sync: false
