# Render Blueprint for the EcoPantry API (FastAPI), free plan.
# The database is Neon PostgreSQL, not Render. The website is on Vercel and
# forwards /api/v1/* here (website/frontend/vercel.json), so the browser only
# ever talks to one origin. Setup steps: docs/DEPLOYMENT.md.
#
# No secrets in this file. DATABASE_URL is marked `sync: false`, so Render asks
# for it in the dashboard when the Blueprint is created and never reads it from Git.
services:
  - type: web
    name: ecopantry-api
    runtime: python
    plan: free
    # Neon project must be in the same place: AWS Asia Pacific (Singapore).
    region: singapore
    branch: development
    rootDir: website/backend
    buildCommand: pip install .
    # The free plan has no pre-deploy step or shell, so migrations run here.
    # `alembic upgrade head` does nothing when the database is already current.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: LOG_LEVEL
        value: INFO
      # Neon suspends its compute when idle; give the first connection time to wake it.
      - key: DATABASE_CONNECT_TIMEOUT
        value: "15"
      - key: DATABASE_URL
        sync: false
