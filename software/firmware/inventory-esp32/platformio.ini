; EcoPantry inventory station: one ESP32 DevKit with DHT11, HX711 load cell (waste bin),
; analog pH probe (experimental), MFRC522 RFID, 16x2 I2C LCD, two LEDs and a buzzer.
; Setup, wiring and calibration: README.md here and hardware/inventory-station/README.md.
;
;   pio run -e esp32dev                 build
;   pio run -e esp32dev -t upload       flash
;   pio device monitor -e esp32dev      serial console (type `help`)
;   pio test -e native                  unit tests on this computer (no board needed)

[platformio]
default_envs = esp32dev

[env:esp32dev]
; Versions are pinned so a rebuild next month produces the same firmware.
; espressif32 8.0.0 ships Arduino-ESP32 core 3.x, the version the original sketch was built with.
platform = espressif32 @ 8.0.0
board = esp32dev
framework = arduino
; WiFi + HTTPS on core 3.x fill ~95% of the default 1.3 MB app slot. min_spiffs gives the
; app 1.9 MB (two slots, so OTA stays possible) and keeps a small filesystem we don't use.
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_flags =
    ; Set to 0 to silence the periodic sensor dump on the serial port.
    -DECOPANTRY_SERIAL_REPORT=1
    ; The setup page refuses plain-http API addresses unless this is 1. Never ship it on.
    -DECOPANTRY_ALLOW_HTTP=0
; The versions the original `^` ranges resolve to today. MFRC522 must be 1.4.12 or later:
; 1.4.11 doesn't compile with the GCC in Arduino-ESP32 core 3.x (MFRC522Extended.cpp).
lib_deps =
    adafruit/DHT sensor library @ 1.4.7
    adafruit/Adafruit Unified Sensor @ 1.1.15
    miguelbalboa/MFRC522 @ 1.4.12
    marcoschwartz/LiquidCrystal_I2C @ 1.1.4
    bogde/HX711 @ 0.7.5
    bblanchon/ArduinoJson @ 7.4.3

; Same firmware, but the setup page also accepts a plain-http API address on the LAN
; (http://192.168.x.y:8000/api/v1). Never ship it.
[env:esp32dev-lan]
extends = env:esp32dev
build_flags =
    -DECOPANTRY_SERIAL_REPORT=1
    -DECOPANTRY_ALLOW_HTTP=1

; Host-side unit tests for lib/ecopantry_core (no Arduino, no board).
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra
