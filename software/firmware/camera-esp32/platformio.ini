; EcoPantry camera: AI Thinker ESP32-CAM serving an MJPEG stream on port 81.
;   pio run -t upload       flash (GPIO0 to GND while uploading, then reset)
;   pio device monitor      prints the stream URL
[platformio]
default_envs = esp32cam

[env:esp32cam]
platform = espressif32 @ 8.0.0
board = esp32cam
framework = arduino
monitor_speed = 115200
