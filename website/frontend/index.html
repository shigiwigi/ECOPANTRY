<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="EcoPantry bakery: products, story and contact details." />
    <title>EcoPantry</title>
    <script>
      // Apply the saved theme before first paint. Mirrors src/features/theme/theme.ts.
      (function () {
        var preference = "system"
        try {
          preference = localStorage.getItem("ecopantry-theme") || "system"
        } catch (e) {}
        var dark =
          preference === "dark" ||
          (preference !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.classList.toggle("dark", dark)
        document.documentElement.style.colorScheme = dark ? "dark" : "light"
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
