# Alembic configuration. Run commands from website/backend/.
# The database URL is NOT set here: alembic/env.py reads DATABASE_URL through
# app.core.config, so credentials stay in the git-ignored .env file.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
# Files sort by date: 20261102_0001_initial_baseline.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
